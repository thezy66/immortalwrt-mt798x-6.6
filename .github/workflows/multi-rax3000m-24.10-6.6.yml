name: Immortalwrt-24.10-6.6 插件选择版RAX3000M固件编译

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      config_file:
        description: '请选择要使用的配置文件 (.config)'
        required: true
        default: '24.10-6.6-openclash-aria2.config'
        type: choice
        options:
          - '24.10-6.6-passwall+openclash.config'
          - '24.10-6.6-passwall2.config'
          - '24.10-6.6-passwall&openclash.config'
          - '24.10-6.6-passwall.config'
          - '24.10-6.6-openclash.config'
          - '24.10-6.6-openclash-aria2.config'
          - '24.10-6.6-openclash-ksmbd.config'
          - '24.10-6.6-openclash+passwall-ksmbd.config'
          - '24.10-6.6-openclash+passwall2-ksmbd.config'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v6

      - name: 极限清理系统环境 & 扩容
        uses: easimon/maximize-build-space@master
        with:
          build-mount-path: /home/runner/work/openwrt_build
          root-reserve-mb: 5120
          swap-size-mb: 1
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 配置虚拟内存 (12GB Swap)
        run: |
          BIG_SPACE="/home/runner/work/openwrt_build"
          mkdir -p $BIG_SPACE
          sudo fallocate -l 12G $BIG_SPACE/swapfile || sudo dd if=/dev/zero of=$BIG_SPACE/swapfile bs=1M count=12288
          sudo chmod 600 $BIG_SPACE/swapfile
          sudo mkswap $BIG_SPACE/swapfile
          sudo swapon $BIG_SPACE/swapfile
          free -h

      # 针对今日报错 (tex-common/dblatex) 的修改：
      # 1. 移除了可能导致 tex-common 报错的 asciidoc, xmlto 等文档生成工具
      # 2. 增加强制清理逻辑
      - name: 安装基础编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # 仅保留编译固件必需的包，去掉了会导致配置失败的 texlive/dblatex 相关依赖
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev \
            libz-dev lld llvm lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-pyelftools python3-setuptools qemu-utils re2c rsync \
            scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xxd zstd
          
          # 额外增加一步：如果因意外拉起了 tex-common 导致损坏，强制修复
          sudo apt-get -f install -y || true
          sudo apt-get clean
          sudo userdel -r builder 2>/dev/null || true

      # 这个步骤是你原有的，为了保险，我也对其进行了精简，去掉了冗余的 asciidoc 和 xmlto
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            ack antlr3 autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xxd zlib1g-dev zstd

      - name: Clone ImmortalWrt Source
        run: |
          cd /home/runner/work/openwrt_build
          git clone -b openwrt-24.10-6.6 --single-branch --filter=blob:none https://github.com/padavanonly/immortalwrt-mt798x-24.10 openwrt
          cd openwrt
          ./scripts/feeds update -a
          rm -rf feeds/luci/applications/luci-app-openclash
          rm -rf feeds/packages/net/openclash
          ./scripts/feeds install -a
          rm -rf feeds/packages/lang/golang
          git clone https://github.com/kenzok8/golang -b 1.25 feeds/packages/lang/golang
          rm -rf package/luci-app-openclash
          git clone --depth=1 -b master https://github.com/vernesong/OpenClash.git package/luci-app-openclash
          rm -rf package/lucky
          git clone https://github.com/gdy666/luci-app-lucky.git package/lucky
          rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-libev,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,trojan-plus,tuic-client,v2ray-plugin,xray-plugin,geoview,shadow-tls}
          git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages package/passwall-packages
          rm -rf feeds/luci/applications/luci-app-passwall
          git clone https://github.com/Openwrt-Passwall/openwrt-passwall package/passwall-luci
          git clone https://github.com/Openwrt-Passwall/openwrt-passwall2 package/passwall2-luci

      - name: Apply Custom .config
        run: |
          SELECTED_CONFIG="${{ github.event.inputs.config_file || '24.10-6.6-openclash-aria2.config' }}"
          echo "MY_CONFIG_NAME=$SELECTED_CONFIG" >> $GITHUB_ENV
          cp $GITHUB_WORKSPACE/$SELECTED_CONFIG /home/runner/work/openwrt_build/openwrt/.config
          cd /home/runner/work/openwrt_build/openwrt
          make defconfig
          make -j$(nproc) download

      - name: Build Toolchain
        run: |
          cd /home/runner/work/openwrt_build/openwrt
          make toolchain/install -j$(nproc)

      - name: Start Build
        run: |
          cd /home/runner/work/openwrt_build/openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Package Firmware
        run: |
          mkdir -p $GITHUB_WORKSPACE/firmware-out
          cd /home/runner/work/openwrt_build/openwrt/bin/targets/mediatek/filogic/
          find . -maxdepth 1 -type f -exec cp {} $GITHUB_WORKSPACE/firmware-out/ \;
          cp /home/runner/work/openwrt_build/openwrt/.config $GITHUB_WORKSPACE/firmware-out/${{ env.MY_CONFIG_NAME }}

      - name: Generate Tag
        id: tag
        run: echo "tag=immortalwrt-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "RAX3000M [${{ env.MY_CONFIG_NAME }}] - ${{ steps.tag.outputs.tag }}"
          body: |
            基于 Padavanonly/ImmortalWrt-mt798x-24.10-6.6 编译
          files: ${{ github.workspace }}/firmware-out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
